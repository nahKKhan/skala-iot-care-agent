<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>IoT 장치 점검·복구 지원</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; height: 100vh; display: flex; flex-direction: column;
    font-family: -apple-system, "Apple SD Gothic Neo", sans-serif;
    background: #1e1e2e; color: #e2e2f0;
    overflow: hidden;   /* #log만 스크롤되게, 바디 자체는 늘어나지 않게 고정 */
  }
  #app {
    flex: 1; min-height: 0;   /* Vue 마운트 루트가 header/#log/form을 감싸므로,
                                 body의 flex 흐름이 여기까지 이어지게 한다 */
    display: flex; flex-direction: column;
  }
  header {
    padding: 14px 20px; background: #262638; border-bottom: 1px solid #3a3a52;
    font-weight: 600; font-size: 15px;
  }
  header span { color: #8b8bd8; font-weight: 400; font-size: 13px; margin-left: 8px; }
  #log {
    flex: 1; min-height: 0;   /* flex 자식 기본 최소높이(콘텐츠 크기)를 풀어줘야
                                 내용이 길어져도 바디가 안 늘어나고 여기서만 스크롤됨 */
    overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px;
  }
  #log::-webkit-scrollbar { width: 9px; }
  #log::-webkit-scrollbar-track { background: transparent; }
  #log::-webkit-scrollbar-thumb { background: #3a3a52; border-radius: 6px; }
  #log::-webkit-scrollbar-thumb:hover { background: #4a4a68; }
  .row { display: flex; }
  .row.user { justify-content: flex-end; }
  .bubble {
    max-width: 70%; padding: 10px 14px; border-radius: 14px; line-height: 1.5;
    font-size: 14px; white-space: pre-wrap;
  }
  .row.user .bubble { background: #5b5bd6; color: white; border-bottom-right-radius: 4px; }
  .row.agent .bubble { background: #2e2e42; border-bottom-left-radius: 4px; }
  .steps {
    max-width: 70%; font-size: 12px; color: #9a9ac0; padding: 6px 14px;
    display: flex; flex-direction: column; gap: 3px;
  }
  .steps .step::before { content: "⏳ "; }
  .steps .step.done::before { content: "✓ "; color: #7ee787; }
  .prompt-box {
    flex-shrink: 0;   /* #log가 스크롤 영역이 되면서(min-height:0) <details>가 flex
                         자식으로서 내용 없이 찌그러지는 걸 방지 */
    max-width: 70%; margin-top: -4px; background: #17171f; border: 1px solid #3a3a52;
    border-radius: 10px; font-size: 12px; overflow: hidden;
  }
  .prompt-box summary {
    cursor: pointer; padding: 7px 12px; color: #8b8bd8; user-select: none;
    list-style: none;
  }
  .prompt-box summary::-webkit-details-marker { display: none; }
  .prompt-box summary::before { content: "🔍 "; }
  .prompt-box[open] summary::before { content: "🔽 "; }
  .prompt-box pre {
    margin: 0; padding: 10px 12px; border-top: 1px solid #3a3a52;
    background: #11111a; color: #c3c3e0; white-space: pre-wrap; word-break: break-word;
    font-family: ui-monospace, "SF Mono", Menlo, monospace; max-height: 320px; overflow-y: auto;
  }
  form { display: flex; gap: 8px; padding: 14px 20px; background: #262638; border-top: 1px solid #3a3a52; }
  input {
    flex: 1; padding: 11px 14px; border-radius: 10px; border: 1px solid #3a3a52;
    background: #1e1e2e; color: #e2e2f0; font-size: 14px;
  }
  input:focus { outline: 1px solid #5b5bd6; }
  button {
    padding: 11px 20px; border-radius: 10px; border: none; background: #5b5bd6;
    color: white; font-size: 14px; cursor: pointer;
  }
  button:disabled { background: #3a3a52; cursor: default; }

  .recovery-panel {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid #525276;
    white-space: normal;
  }
  .recovery-target { margin: 0 0 5px; font-size: 13px; font-weight: 600; }
  .recovery-hint { margin: 0 0 10px; font-size: 12px; color: #b8b8d3; line-height: 1.5; }
  .recovery-button { padding: 9px 14px; font-size: 13px; }
  .recovery-button:focus-visible { outline: 2px solid #b8b8ff; outline-offset: 3px; }
  .recovery-feedback { margin: 10px 0 0; font-size: 13px; line-height: 1.5; }
  .recovery-feedback.done { color: #9de4b1; }
  .recovery-feedback.failed, .recovery-feedback.unknown { color: #ffd28b; }
  .recovery-feedback.blocked { color: #ffb0b0; }
  .recovery-feedback.superseded { color: #b8b8d3; }
  .recovery-metrics {
    display: grid; grid-template-columns: auto 1fr; gap: 5px 14px;
    margin: 10px 0 0; font-size: 12px;
  }
  .recovery-metrics dt { color: #b8b8d3; }
  .recovery-metrics dd { margin: 0; font-variant-numeric: tabular-nums; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; padding: 10px 20px; background: #262638; }
  .toolbar select { max-width: 320px; padding: 8px; background: #1e1e2e; color: #e2e2f0; border: 1px solid #525276; border-radius: 6px; }
  .toolbar button { padding: 8px 12px; font-size: 12px; }
  .toolbar small { color: #b8b8d3; }
  .sources { margin-top: 14px; font-size: 12px; white-space: normal; }
  .sources summary { cursor: pointer; color: #b8b8ff; }
  .sources pre { white-space: pre-wrap; max-height: 240px; overflow: auto; }
  .history { padding: 8px 20px; border-top: 1px solid #3a3a52; font-size: 12px; }
  .history summary { cursor: pointer; }
  .history-list { max-height: 180px; overflow: auto; }
  .history-row { padding: 8px 0; border-bottom: 1px solid #3a3a52; }
  @media (max-width: 600px) {
    .bubble, .steps, .prompt-box { max-width: 94%; }
    form { padding: 12px; }
    input { min-width: 0; }
  }
</style>
</head>
<body>
<div id="app">
  <header>IoT 장치 점검·복구 지원 <span>{{ backendLabel }}</span></header>
  <div class="toolbar">
    <select v-model="selectedDevice" aria-label="점검 장치 선택" :disabled="sending || recovering !== null">
      <option v-for="device in deviceList" :value="device.device_id">{{ device.device_id }} · {{ device.name }}</option>
    </select>
    <button type="button" @click="inspectSelected" :disabled="sending || recovering !== null">선택 장치 점검</button>
    <button type="button" @click="resetSelected" :disabled="sending || recovering !== null">가상 상태 초기화</button>
    <small>{{ toolbarMessage }}</small>
  </div>
  <div id="log" ref="logEl">
    <template v-for="item in log" :key="item.id">
      <div v-if="item.kind === 'user'" class="row user">
        <div class="bubble">{{ item.text }}</div>
      </div>

      <div v-else-if="item.kind === 'steps'" class="steps">
        <div v-for="(step, i) in item.steps" :key="i" class="step">{{ step }}</div>
      </div>

      <div v-else-if="item.kind === 'agent'" class="row agent">
        <div class="bubble">
          <div>{{ item.text }}</div>
          <details v-if="item.sources?.length" class="sources">
            <summary>검색된 매뉴얼 근거 {{ item.sources.length }}개 보기</summary>
            <div v-for="source in item.sources" :key="source.source_id">
              <p>[{{ source.source_id }}] {{ source.title }} · {{ source.section }}</p>
              <small>{{ source.origin }} · 문서 버전 {{ source.version }}</small>
              <pre>{{ source.text }}</pre>
              <ul v-if="source.causes?.length">
                <li v-for="cause in source.causes" :key="cause.id">문서 공통 후보: {{ cause.title }} · 추가 확인: {{ cause.check }}</li>
              </ul>
            </div>
          </details>
          <div v-if="item.recovery" class="recovery-panel">
            <p class="recovery-target">{{ item.recovery.device_name }} · {{ item.recovery.device_id }}</p>
            <p class="recovery-hint">가상 장치의 수집 모듈을 재시작하고 새 데이터 수신 여부를 확인합니다.</p>
            <button
              type="button"
              class="recovery-button"
              :disabled="sending || recovering !== null || item.recoveryStatus !== 'ready'"
              :aria-busy="item.recoveryStatus === 'running'"
              @click="onRecover(item)"
            >{{ recoveryButtonLabel(item) }}</button>
            <p v-if="item.recoveryFeedback"
               class="recovery-feedback"
               :class="item.recoveryStatus"
               role="status" aria-live="polite">{{ item.recoveryFeedback }}</p>
            <dl v-if="item.recoveryResult?.before && item.recoveryResult?.after" class="recovery-metrics">
              <dt>마지막 수신 이후</dt>
              <dd>{{ item.recoveryResult.before.telemetry_age_seconds }}초 → {{ item.recoveryResult.after.telemetry_age_seconds }}초</dd>
              <dt>데이터 수신 번호</dt>
              <dd>{{ item.recoveryResult.before.telemetry_sequence }} → {{ item.recoveryResult.after.telemetry_sequence }}</dd>
            </dl>
          </div>
        </div>
      </div>

      <details v-else-if="item.kind === 'prompt'" class="prompt-box">
        <summary>LLM에 전달된 최종 프롬프트 보기</summary>
        <pre>{{ item.text }}</pre>
      </details>
    </template>
  </div>
  <details class="history">
    <summary>최근 유지보수 기록 {{ maintenanceRecords.length }}건 · <button type="button" @click="loadMaintenance">새로고침</button></summary>
    <div class="history-list">
      <p v-if="historyMessage">{{ historyMessage }}</p>
      <div v-for="record in maintenanceRecords" :key="record.id" class="history-row">
        {{ record.device_id }} · {{ statusLabel(record.status) }} · {{ record.updated_at }}<br>{{ record.summary }}
      </div>
    </div>
  </details>
  <form @submit.prevent="onSubmit">
    <input
      v-model="input"
      autocomplete="off"
      placeholder="예: sensor-02 점검해줘"
      :disabled="sending || recovering !== null"
    />
    <button type="submit" :disabled="sending || recovering !== null">보내기</button>
  </form>
</div>

<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script>
const { createApp, ref, reactive, nextTick } = Vue;

const STEP_LABELS = {
  ManualSearchCompleted: e => `IoT 매뉴얼 검색 완료 · 관련 문단 ${e.count}개`,
  AnswerQualityChecked: e => e.passed ? '출처·원인 후보·조치 정책 검수 통과' : `답변 검수 미달 · ${e.attempt < 2 ? '한 번 재작성합니다' : '확인된 사실로 안내합니다'}`,
  DeviceExplanationStarted: () => '장치 상태·점검 결과·매뉴얼을 바탕으로 LLM이 설명을 작성하고 있습니다.',
  PlanCreated: e => `계획 수립: 할 일 ${e.task_count}가지${e.targets?.length ? ` (시스템: ${e.targets.join(', ')})` : ''}`,
  GateApplied: e => e.removed_analysis_tasks ? `불필요한 작업 ${e.removed_analysis_tasks}건 제거` : null,
  TaskCompleted: e => (e.source === 'monitoring'
      ? `모니터링 지표 확인 (시스템: ${e.target})`
      : `대응 매뉴얼(runbook) 조회 (장애유형: ${e.target})`) + (e.retries ? ' (재시도 성공)' : ''),
  ReplanCheck: e => e.is_sufficient ? null : `정보 부족 → 장애유형 "${e.target}"로 추가 조사`,
  DraftWritten: e => `답변 초안 작성 (시도 ${e.attempt})`,
  Validation: e => e.verdict === '합격' ? '검수 통과' : '검수 반려 → 다시 작성',
  Finalize: () => '최종 답변 완성',
};

createApp({
  setup() {
    const backendLabel = ref('백엔드 연결 확인 중');
    const log = ref([]);
    const input = ref('');
    const sending = ref(false);
    const recovering = ref(null);
    const logEl = ref(null);
    const deviceList = ref([]);
    const selectedDevice = ref('sensor-02');
    const toolbarMessage = ref('가상 장치 시나리오');
    const maintenanceRecords = ref([]);
    const historyMessage = ref('');
    const thread = 't-web-' + Math.random().toString(36).slice(2, 8);
    let nextId = 0;

    fetch('/health').then(r => {
      if (!r.ok) throw new Error('health check failed');
      return r.json();
    }).then(h => {
      backendLabel.value = h.llm_backend === 'fake'
        ? '가상 장치 · 데모 모드 / LLM 미사용'
        : `가상 장치 · LLM 설명: ${h.llm_backend} (${h.quality_llm})`;
    }).catch(() => { backendLabel.value = '백엔드 연결 확인 필요'; });

    function statusLabel(status) {
      return {normal: '정상', open: '점검 필요', resolved: '복구 확인', needs_visit: '현장 점검 필요', verification_pending: '복구 확인 불가'}[status] || status;
    }
    async function loadMaintenance() {
      try {
        const response = await fetch('/api/maintenance');
        if (!response.ok) throw new Error('history unavailable');
        maintenanceRecords.value = (await response.json()).records || [];
        historyMessage.value = maintenanceRecords.value.length ? '' : '아직 점검 기록이 없습니다.';
      } catch { historyMessage.value = '유지보수 기록을 불러오지 못했습니다.'; }
    }
    async function loadDevices() {
      try {
        const response = await fetch('/api/devices');
        if (!response.ok) throw new Error('devices unavailable');
        deviceList.value = (await response.json()).devices || [];
      } catch { toolbarMessage.value = '장치 목록 조회 실패 · ID로 점검할 수 있습니다.'; }
    }
    function inspectSelected() {
      input.value = selectedDevice.value + ' 점검해줘';
      onSubmit();
    }
    async function resetSelected() {
      if (sending.value || recovering.value !== null) return;
      recovering.value = selectedDevice.value;
      try {
        const response = await fetch('/api/scenario/reset', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({device_id: selectedDevice.value})});
        if (!response.ok) throw new Error('reset failed');
        for (const item of log.value) {
          if (item.recovery?.device_id === selectedDevice.value && item.recoveryStatus === 'ready') item.recoveryStatus = 'superseded';
        }
        toolbarMessage.value = '가상 상태를 초기화했습니다. 유지보수 기록은 보존됩니다.';
        await loadDevices();
      } catch { toolbarMessage.value = '초기화 결과를 확인하지 못했습니다. 다시 점검해 주세요.'; }
      finally { recovering.value = null; }
    }
    loadDevices();
    loadMaintenance();

    async function scrollToBottom() {
      await nextTick();
      if (logEl.value) logEl.value.scrollTop = logEl.value.scrollHeight;
    }

    function recoveryButtonLabel(item) {
      return {
        ready: '가상 복구 실행',
        running: '복구 실행·상태 확인 중…',
        done: '가상 복구 완료',
        failed: '미복구 · 다시 점검해 주세요',
        blocked: '실행 거부 · 다시 점검해 주세요',
        unknown: '결과 확인 필요',
        superseded: '다시 점검해 주세요',
      }[item.recoveryStatus] || '가상 복구 실행';
    }

    async function onRecover(item) {
      // DOM이 비활성화되기 전 연속 클릭도 여기서 차단한다.
      if (sending.value || recovering.value !== null
          || !item.recovery || item.recoveryStatus !== 'ready') return;

      const deviceId = item.recovery.device_id;
      recovering.value = deviceId;
      item.recoveryStatus = 'running';
      item.recoveryFeedback = '가상 명령 실행 후 장치 상태를 다시 확인하고 있습니다.';
      const controller = new AbortController();
      const timeout = setTimeout(() => controller.abort(), 65000);

      try {
        const response = await fetch('/api/recover', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ device_id: deviceId,
            request_id: item.requestId || (item.requestId = `recovery-${thread}-${item.id}-${Date.now()}`),
            scenario_revision: item.recovery.scenario_revision,
            expected_sequence: item.recovery.expected_sequence }),
          signal: controller.signal,
        });
        const data = await response.json();

        if (!response.ok) {
          item.recoveryStatus = [400, 404, 409, 422].includes(response.status)
            ? 'blocked' : 'unknown';
          item.recoveryFeedback = typeof data.detail === 'string'
            ? data.detail : '복구 결과를 확인하지 못했습니다. 장치 상태를 다시 점검해 주세요.';
          return;
        }

        if (data.device_id !== deviceId) {
          throw new Error('recovery target mismatch');
        }
        item.recoveryResult = data;
        if (data.recovery_verified === true && data.before && data.after) {
          item.recoveryStatus = 'done';
          item.recoveryFeedback = '새 데이터 수신과 정상 상태가 확인됐습니다.';
        } else if (data.recovery_verified === false) {
          item.recoveryStatus = 'failed';
          item.recoveryFeedback = '명령은 접수됐지만 정상 복구가 확인되지 않았습니다. 추가 점검이 필요합니다.';
        } else {
          item.recoveryStatus = 'unknown';
          item.recoveryFeedback = data.message
            || '명령 실행 결과를 확인하지 못했습니다. 장치 상태를 다시 점검해 주세요.';
        }
      } catch (error) {
        // 요청이 도착했을 가능성이 있으므로 자동 재시도하지 않는다.
        item.recoveryStatus = 'unknown';
        item.recoveryFeedback = error.name === 'AbortError'
          ? '응답 시간이 초과됐습니다. 재실행 전에 장치 상태를 다시 점검해 주세요.'
          : '복구 결과를 확인하지 못했습니다. 재실행 전에 장치 상태를 다시 점검해 주세요.';
      } finally {
        clearTimeout(timeout);
        for (const previous of log.value) {
          if (previous !== item && previous.recovery?.device_id === deviceId
              && previous.recoveryStatus === 'ready') {
            previous.recoveryStatus = 'superseded';
            previous.recoveryFeedback = '다른 점검 결과에서 복구를 요청했습니다. 최신 상태를 다시 점검해 주세요.';
          }
        }
        recovering.value = null;
        loadMaintenance();
      }
    }

    function onSubmit() {
      const text = input.value.trim();
      if (!text || sending.value || recovering.value !== null) return;

      log.value.push({ id: nextId++, kind: 'user', text });
      input.value = '';
      sending.value = true;
      scrollToBottom();

      const stepsItem = reactive({ id: nextId++, kind: 'steps', steps: [] });
      log.value.push(stepsItem);
      scrollToBottom();

      const url = `/chat/stream?message=${encodeURIComponent(text)}&thread_id=${encodeURIComponent(thread)}`;
      const es = new EventSource(url);
      let streamItem = null;
      let streamAttempt = null;
      let receivedFinal = false;

      es.onmessage = (event) => {
        if (event.data === '[DONE]') { es.close(); sending.value = false; return; }
        let e;
        try { e = JSON.parse(event.data); } catch { return; }

        if (e.type === 'AnswerToken') {
          if (!streamItem || streamAttempt !== e.attempt) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
            streamAttempt = e.attempt;
          }
          streamItem.text += e.delta;
          scrollToBottom();
          return;
        }

        if (e.type === 'FinalAnswer') {
          receivedFinal = true;
          if (!streamItem) {
            streamItem = reactive({ id: nextId++, kind: 'agent', text: '' });
            log.value.push(streamItem);
          }
          streamItem.text = e.reply;
          streamItem.sources = e.sources || [];
          loadMaintenance();
          if (e.recovery?.action === 'restart_collection'
              && typeof e.recovery.device_id === 'string') {
            streamItem.recovery = e.recovery;
            streamItem.recoveryStatus = 'ready';
          }
          if (e.prompt) log.value.push({ id: nextId++, kind: 'prompt', text: e.prompt });
          streamItem = null;
          streamAttempt = null;
          scrollToBottom();
          return;
        }

        const fn = STEP_LABELS[e.type];
        if (!fn) return;
        const label = fn(e);
        if (!label) return;
        stepsItem.steps.push(label);
        scrollToBottom();
      };

      es.onerror = () => {
        es.close();
        sending.value = false;
        if (!receivedFinal) {
          log.value.push({ id: nextId++, kind: 'agent',
            text: '점검 결과를 받지 못했습니다. 백엔드 연결 상태를 확인한 뒤 다시 점검해 주세요.' });
          scrollToBottom();
        }
      };
    }

    return { backendLabel, log, input, sending, recovering, logEl,
      deviceList, selectedDevice, toolbarMessage, maintenanceRecords, historyMessage,
      inspectSelected, resetSelected, loadMaintenance, statusLabel,
      onSubmit, onRecover, recoveryButtonLabel };
  },
}).mount('#app');
</script>
</body>
</html>
